    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Label / Radio Click Test</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem;
        }

        h2,
        h3 {
            margin-bottom: 0.5rem;
        }

        label,
        .fake-label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin: 0.4rem 0;
            cursor: pointer;
        }

        .fake-label {
            padding: 0.2rem 0.4rem;
            border: 1px dashed #aaa;
            border-radius: 4px;
        }

        input[type="radio"] {
            transform: scale(1.3);
            margin-right: 0.4rem;
        }

        hr {
            margin: 1.5rem 0;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" type="image/jpg" href="engram.ico" />
</head>

<body>
    <h2>Label / Radio Click Test</h2>

    <!-- ✅ Associated Labels -->
    <h3>Associated Labels (wrapped form)</h3>
    <div>
        <label>
            <input type="radio" name="group1" value="alpha">
            Alpha
        </label><br>
        <label>
            <input type="radio" name="group1" value="beta">
            Beta
        </label><br>
        <label>
            <input type="radio" name="group1" value="gamma">
            Gamma
        </label>
    </div>

    <hr />

    <!-- 🚫 Unassociated Labels -->
    <h3>Unassociated Labels (click does NOT trigger radio)</h3>
    <div>
        <input id="r1" type="radio" name="group2" value="delta">
        <span class="fake-label">Delta</span><br>

        <input id="r2" type="radio" name="group2" value="epsilon">
        <span class="fake-label">Epsilon</span><br>

        <input id="r3" type="radio" name="group2" value="zeta">
        <span class="fake-label">Zeta</span>
    </div>

    <hr />

    <!-- 🆕 Explicitly Associated Labels -->
    <h3>Associated Labels (using for="id" form)</h3>
    <div>
        <input id="a1" type="radio" name="group3" value="theta">
        <label for="a1">Theta</label><br>

        <input id="a2" type="radio" name="group3" value="iota">
        <label for="a2">Iota</label><br>

        <input id="a3" type="radio" name="group3" value="kappa">
        <label for="a3">Kappa</label>
    </div>

    <script>
        // Helper for logging events
        function logEvent(e, origin) {
            console.log(`${origin} → ${e.type} | target: ${e.target.tagName}`);
        }

        // Label (both wrapped and for="id" types)
        document.querySelectorAll('label').forEach(label => {
            label.addEventListener('pointerdown', e => logEvent(e, 'label'));
            label.addEventListener('pointerup', e => logEvent(e, 'label'));
            label.addEventListener('click', e => logEvent(e, 'label'));
        });

        // Radios
        document.querySelectorAll('input[type="radio"]').forEach(input => {
            input.addEventListener('pointerdown', e => logEvent(e, 'radio'));
            input.addEventListener('pointerup', e => logEvent(e, 'radio'));
            input.addEventListener('click', e => logEvent(e, 'radio'));
        });

        // Fake (unassociated) labels
        document.querySelectorAll('.fake-label').forEach(span => {
            span.addEventListener('pointerdown', e => logEvent(e, 'fake-label'));
            span.addEventListener('pointerup', e => logEvent(e, 'fake-label'));
            span.addEventListener('click', e => logEvent(e, 'fake-label'));
        });
    </script>
</body>

</html>
