<!DOCTYPE html>
<html lang="en">

<head>
    <script src="firstfile.js"></script>
    <script src="https://code.jquery.com/jquery-1.10.2.js"></script>
    <script>
        (function(apiKey) {
            (function(p, e, n, d, o) {
                var v, w, x, y, z;
                o = p[d] = p[d] || {};
                o._q = o._q || [];
                v = ['initialize', 'identify', 'updateOptions', 'pageLoad', 'track'];
                for (w = 0, x = v.length; w < x; ++w)(function(m) {
                    o[m] = o[m] || function() {
                        o._q[m === v[0] ? 'unshift' : 'push']([m].concat([].slice.call(arguments, 0)));
                    };
                })(v[w]);
                y = e.createElement(n);
                y.async = !0;
                y.src = 'https://cdn.pendo.io/agent/static/' + apiKey + '/pendo.js';
                z = e.getElementsByTagName(n)[0];
                z.parentNode.insertBefore(y, z);
            })(window, document, 'script', 'pendo');
            pendo.initialize({
                visitor: {
                    id: user_id,
                    email: user_email,
                    full_name: user_full_name,

                    random: user_random_data
                },

                account: {

    <title>Page Title</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" type="image/jpg" href="engram.ico" />
</head>

<body>

    <div class="header">
        <img class="headerIcon" src="img/7513466.png" width="20"><br><br>
        <h1>Hello</h1>
        <p>I am a website</p>
        <p>You are <span id="visitorHeader"></span></p>
        <script>
            function visitorHeader() {
                window.setInterval(function getvisitorHeader() {
                    var dt = new Date();
                    document.getElementById("visitorHeader").innerHTML = pendo.getVisitorId();
                }, 1000);
            }
            setTimeout(visitorHeader, 1000);
        </script>
    </div>

    <!--Navigation bar-->
    <div id="nav-placeholder">

    </div>

    <script>
        $(function() {
            $("#nav-placeholder").load("navbar.html");
        });
    </script>
    <!--end of Navigation bar-->

    <div class="row">
        <div class="side">
            <h2>Stuff</h2>
            <img src="img/rainbowEmblem.png" width="300"><br>
            <img src="img/catEmblem.png" width="300"><br>
            <img src="img/heartEmblem.png" width="300"><br>
            <p>Lorem ipsum nightstalker fatebringer.</p>

        </div>
        <div class="main">
            <div>
                <!-- this is an example button -->
                <button onclick="dummyClick()" class="buttonRainbow" id="dummyClick" style='padding: 0px 10px; ;border: solid 1px black; height: 40px;vertical-align: middle;'>Click me for a dummy event!</button>
                <script type="text/javascript">
                    function dummyClick() {
                        console.log("yeah, it's clicked");
                    }
                </script>
            </div>
            <div>
                <button onclick="loadPageList()" class="buttonRainbow" style='padding: 0px 10px; border: solid 1px black; height: 40px; vertical-align: middle; margin-top: 12px;'>List all pages</button>
                <div id="page-list" style="margin-top: 12px;"></div>
                <script type="text/javascript">
                    async function loadPageList() {
                        const container = document.getElementById('page-list');
                        container.innerHTML = 'Loading...';

                        let files;
                        try {
                            const res = await fetch('/api/files');
                            if (!res.ok) throw new Error(res.status);
                            files = await res.json();
                        } catch (e) {
                            container.innerHTML = '<em>Could not load file list. Make sure you are running <code>python3 server.py</code> instead of <code>python -m http.server</code>.</em>';
                            return;
                        }

                        if (files.length === 0) {
                            container.innerHTML = '<em>No HTML files found.</em>';
                            return;
                        }

                        container.innerHTML = '<table style="border-collapse:collapse; width:100%;">' +
                            '<thead><tr><th style="text-align:left; padding:6px 12px; border-bottom:2px solid #ccc;">Title</th><th style="text-align:left; padding:6px 12px; border-bottom:2px solid #ccc;">File</th></tr></thead>' +
                            '<tbody>' +
                            files.map(f =>
                                `<tr><td style="padding:5px 12px;"><a href="${f.href}">${f.label}</a></td><td style="padding:5px 12px; color:#888; font-size:0.9em;">${f.href}</td></tr>`
                            ).join('') +
                            '</tbody></table>';
                    }
                </script>
            </div>
        </div>
    </div>


</body>

</html>
