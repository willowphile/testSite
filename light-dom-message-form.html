<!DOCTYPE html>

    <title>Light DOM Recipient Dropdown</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
            background: #f0f2f5;
            color: #111;
            padding: 24px;
        }

        /* ── q2-select light DOM styles ── */
        q2-select {
            display: block;
            position: relative;
            font-family: inherit;
            font-size: 14px;
        }

        q2-select .field-container {
            border: 1px solid #ccd0d9;
            border-radius: 8px;
            background: #fff;
            position: relative;
            transition: border-color 0.15s;
        }

        q2-select .field-container:focus-within {
            border-color: #4a90d9;
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.15);
        }

        q2-select .label-wrapper {
            padding: 4px 10px 0;
        }

        q2-select .label-wrapper label {
            font-size: 11px;
            color: #666;
            display: block;
            cursor: pointer;
            user-select: none;
        }

        q2-select .input-container {
            display: flex;
            align-items: center;
            padding: 0 10px;
            height: 34px;
            cursor: pointer;
        }

        q2-select .input-icons-container-left {
            width: 16px;
            margin-right: 6px;
            flex-shrink: 0;
        }

        q2-select input[test-id="inputField"] {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            color: #111;
            cursor: pointer;
            min-width: 0;
            pointer-events: none;
        }

        q2-select input[test-id="inputField"]::placeholder {
            color: #aaa;
        }

        q2-select .input-icons-container-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        q2-select .chevron {
            width: 14px;
            height: 14px;
            color: #888;
            transition: transform 0.18s ease;
            display: block;
        }

        q2-select .chevron.open {
            transform: rotate(180deg);
        }

        q2-select .popover {
            display: none;
            position: absolute;
            top: calc(100% + 3px);
            left: 0;
            right: 0;
            z-index: 9999;
            background: #fff;
            border: 1px solid #ccd0d9;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            max-height: 210px;
            overflow-y: auto;
        }

        q2-select .popover.open {
            display: block;
        }

        q2-select .option {
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            color: #111;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.1s;
        }

        q2-select .option:hover {
            background: #f4f6fa;
        }

        q2-select .option[aria-selected="true"] {
            background: #eef3fb;
            color: #1a5fa8;
        }

        q2-select .option:first-child {
            border-radius: 8px 8px 0 0;
        }

        q2-select .option:last-child {
            border-radius: 0 0 8px 8px;
        }

        q2-select .option:only-child {
            border-radius: 8px;
        }

        /* keep q2-option elements out of visual flow */
        q2-option {
            display: none;
        }
    </style>
    <script>

<body>

    <q2-select id="btnRecipient" class="focus-control mrg-T-sm" test-id="btnRecipient" label="Message recipient" placeholder="--Select Recipient--" stencil-hydrated>
        <q2-option test-id="msgRecipientOption1" tabindex="-1" aria-selected="false" role="option" value="1" stencil-hydrated display="Customer Service">Customer Service</q2-option>
        <q2-option test-id="msgRecipientOption3" tabindex="-1" aria-selected="false" role="option" value="3" stencil-hydrated display="Wire Transfer Services">Wire Transfer Services</q2-option>
        <q2-option test-id="msgRecipientOption18" tabindex="-1" aria-selected="false" role="option" value="18" stencil-hydrated display="Travel Note">Travel Note</q2-option>
    </q2-select>

    <button onclick="dummyClick()">
        oh hai
    </button>
    <script type="text/javascript">
        function dummyClick() {
            console.log("yeah, it's clicked");
        }
    </script>

    <script>
        class Q2Option extends HTMLElement {}
        customElements.define('q2-option', Q2Option);

        class Q2Select extends HTMLElement {
            connectedCallback() {
                this._value = '';
                this._open = false;

                const label = this.getAttribute('label') || '';
                const placeholder = this.getAttribute('placeholder') || '';
                const testId = this.getAttribute('test-id') || this.id || '';
                const inputId = `input-${testId}`;

                const options = Array.from(this.querySelectorAll('q2-option')).map(el => ({
                    value: el.getAttribute('value') || '',
                    label: el.getAttribute('display') || el.textContent.trim(),
                    testId: el.getAttribute('test-id') || ''
                }));

                /* build light DOM UI directly on this element */
                const ui = document.createElement('div');
                ui.className = 'field-container';
                ui.innerHTML = `
          <div class="label-wrapper">
            <label for="${inputId}">${label}</label>
          </div>
          <div class="input-container" id="inputContainer" tabindex="-1" test-id="inputContainer" role="button" aria-haspopup="listbox" aria-expanded="false">
            <div class="input-icons-container-left"></div>
            <input
              id="${inputId}"
              type="text"
              aria-required="true"
              aria-invalid="false"
              aria-haspopup="listbox"
              aria-expanded="false"
              autocomplete="off"
              autocorrect="off"
              placeholder="${placeholder}"
              role="combobox"
              readonly
              test-id="inputField"
            />
            <div class="input-icons-container-right">
              <svg class="chevron" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <div class="popover" id="popover" role="listbox" aria-label="${label}">
            ${options.map(o => `
              <div class="option" role="option" data-value="${o.value}" aria-selected="false" test-id="${o.testId}">${o.label}</div>
            `).join('')}
          </div>
        `;

                this.appendChild(ui);

                /* refs */
                const inputContainer = ui.querySelector('#inputContainer');
                const input = ui.querySelector('input');
                const popover = ui.querySelector('#popover');
                const chevron = ui.querySelector('.chevron');

                const applyOpen = () => {
                    popover.classList.toggle('open', this._open);
                    chevron.classList.toggle('open', this._open);
                    input.setAttribute('aria-expanded', this._open);
                    inputContainer.setAttribute('aria-expanded', this._open);
                };

                inputContainer.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this._open = !this._open;
                    applyOpen();
                });

                popover.addEventListener('click', (e) => {
                    const opt = e.target.closest('.option');
                    if (!opt) return;
                    this._value = opt.dataset.value;
                    input.value = opt.textContent.trim();
                    this._open = false;
                    applyOpen();
                    popover.querySelectorAll('.option').forEach(o => {
                        o.setAttribute('aria-selected', o.dataset.value === this._value);
                    });
                    this.dispatchEvent(new CustomEvent('change', {
                        bubbles: true,
                        detail: {
                            value: this._value,
                            label: input.value
                        }
                    }));
                });

                document.addEventListener('click', (e) => {
                    if (!this.contains(e.target)) {
                        this._open = false;
                        applyOpen();
                    }
                });

                inputContainer.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this._open = !this._open;
                        applyOpen();
                    }
                    if (e.key === 'Escape') {
                        this._open = false;
                        applyOpen();
                    }
                });
            }
        }

        customElements.define('q2-select', Q2Select);
    </script>

</body>
