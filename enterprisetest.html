    <title>Three‑Panel Layout</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            display: grid;
            grid-template-rows: auto 1fr;
            grid-template-columns: 200px 1fr;
            height: 100vh;
        }


        header {
            grid-column: 1 / 3;
            background: #7a1ce6;
            color: white;
            padding: 0 1rem;
            font-size: 1.25rem;
            display: flex;
            flex-direction: column;  /* stack children */
            align-items: flex-start; /* don't center them horizontally */
            gap: 0.5rem;  /* optional spacing */
        }

        header>div {
            width: 100%;
            margin: 10px;
            /* let each row fill the header */
        }


        aside {
            background: #f3f4f6;
            padding: 1rem;
            border-right: 1px solid #e5e7eb;
        }


        main {
            padding: 1.5rem;
            margin: 0px 50px;
        }


        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            /* space between label text and input */
        }

        label input {
            flex: 1;
            /* lets the input expand to fill available space */
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            /* ensures padding stays inside the width */
        }


        input,
        textarea,
        button {
            padding: 0.5rem;
            font-size: 1rem;
        }


        button {
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
        }

        .sticky {
            position: fixed;
            top: 0;
        }

        a {
            color: white;
        }
    </style>

    <script>
        const sidebar = document.querySelector('aside div');
        const sidebarTop = sidebar.getBoundingClientRect().top + window.scrollY;


        window.addEventListener('scroll', () => {
            if (window.scrollY > sidebarTop) {
                sidebar.classList.add('sticky');
            } else {
                sidebar.classList.remove('sticky');
